[project]
name = "mototracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "playwright>=1.49",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
